<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" width="100%" height="100%" font-family="Arial, sans-serif">
<rect width="1200" height="100%" fill="#FFFFFF"/>
<text x="600" y="36" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">Coordinate frames and rotation representations</text>
<text x="600" y="64" font-size="14.5" fill="#475569" text-anchor="middle">Conceptual geometry - all transforms must declare source and destination frames</text>
<rect x="40" y="84" width="1120" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="160" cy="138" r="26" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<line x1="160" y1="138" x2="178" y2="138" stroke="#e11d48" stroke-width="2.5"/>
<line x1="160" y1="138" x2="160" y2="120" stroke="#059669" stroke-width="2.5"/>
<line x1="160" y1="138" x2="148" y2="150" stroke="#2563eb" stroke-width="2.5"/>
<text x="160" y="182" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">{W} World</text>
<line x1="195" y1="138" x2="415" y2="138" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="409,133 419,138 409,143" fill="#2563eb"/>
<text x="305" y="126" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">T(W,B): Base Pose</text>
<circle cx="460" cy="138" r="26" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<line x1="460" y1="138" x2="478" y2="138" stroke="#e11d48" stroke-width="2.5"/>
<line x1="460" y1="138" x2="460" y2="120" stroke="#059669" stroke-width="2.5"/>
<line x1="460" y1="138" x2="448" y2="150" stroke="#2563eb" stroke-width="2.5"/>
<text x="460" y="182" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">{B} Robot Base</text>
<line x1="495" y1="126" x2="725" y2="114" stroke="#0d9488" stroke-width="2.5"/>
<polygon points="719,109 729,114 719,119" fill="#0d9488"/>
<text x="610" y="108" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">T(B,E)(q): Forward Kinematics</text>
<circle cx="775" cy="118" r="26" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<line x1="775" y1="118" x2="793" y2="118" stroke="#e11d48" stroke-width="2.5"/>
<line x1="775" y1="118" x2="775" y2="100" stroke="#059669" stroke-width="2.5"/>
<line x1="775" y1="118" x2="763" y2="130" stroke="#2563eb" stroke-width="2.5"/>
<text x="775" y="162" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">{E} End-Effector</text>
<line x1="495" y1="152" x2="985" y2="152" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,3"/>
<polygon points="979,147 989,152 979,157" fill="#7c3aed"/>
<text x="740" y="174" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">T(B,C): Calibrated Camera Extrinsics</text>
<circle cx="1030" cy="138" r="26" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<line x1="1030" y1="138" x2="1048" y2="138" stroke="#e11d48" stroke-width="2.5"/>
<line x1="1030" y1="138" x2="1030" y2="120" stroke="#059669" stroke-width="2.5"/>
<line x1="1030" y1="138" x2="1018" y2="150" stroke="#2563eb" stroke-width="2.5"/>
<text x="1030" y="182" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">{C} Camera</text>
<rect x="40.0" y="232.0" width="357.3" height="191" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="40.0" y="232.0" width="357.3" height="36" rx="10" fill="#2563eb"/>
<text x="56.0" y="256" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">Frame convention</text>
<text x="56.0" y="292" font-size="15.5" fill="#1e293b" text-anchor="start">T(A,B) maps coordinates in frame B</text>
<text x="56.0" y="313" font-size="15.5" fill="#1e293b" text-anchor="start">into frame A.</text>
<text x="56.0" y="339" font-size="15.5" fill="#1e293b" text-anchor="start">Compose T(world,base) with</text>
<text x="56.0" y="360" font-size="15.5" fill="#1e293b" text-anchor="start">T(base,tool); calibrate camera</text>
<text x="56.0" y="381" font-size="15.5" fill="#1e293b" text-anchor="start">extrinsics separately.</text>
<rect x="413.3" y="232.0" width="357.3" height="191" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<rect x="413.3" y="232.0" width="357.3" height="36" rx="10" fill="#0d9488"/>
<text x="429.3333333333333" y="256" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">Three rotation choices</text>
<text x="429.3333333333333" y="292" font-size="15.5" fill="#1e293b" text-anchor="start">Euler angles: a local chart with</text>
<text x="429.3333333333333" y="313" font-size="15.5" fill="#1e293b" text-anchor="start">singularities.</text>
<text x="429.3333333333333" y="339" font-size="15.5" fill="#1e293b" text-anchor="start">Unit quaternion: normalized, with</text>
<text x="429.3333333333333" y="360" font-size="15.5" fill="#1e293b" text-anchor="start">q and -q representing the same</text>
<text x="429.3333333333333" y="381" font-size="15.5" fill="#1e293b" text-anchor="start">rotation.</text>
<rect x="786.7" y="232.0" width="357.3" height="191" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<rect x="786.7" y="232.0" width="357.3" height="36" rx="10" fill="#7c3aed"/>
<text x="802.6666666666666" y="256" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">Control consistency</text>
<text x="802.6666666666666" y="292" font-size="15.5" fill="#1e293b" text-anchor="start">6D rotation outputs require</text>
<text x="802.6666666666666" y="313" font-size="15.5" fill="#1e293b" text-anchor="start">orthonormalization.</text>
<text x="802.6666666666666" y="339" font-size="15.5" fill="#1e293b" text-anchor="start">Express pose error, angular</text>
<text x="802.6666666666666" y="360" font-size="15.5" fill="#1e293b" text-anchor="start">velocity and wrench in consistent</text>
<text x="802.6666666666666" y="381" font-size="15.5" fill="#1e293b" text-anchor="start">frames.</text>
<text x="600" y="467" font-size="14" fill="#475569" text-anchor="middle">Teaching schematic. No duplicate quaternion panel; no uncalibrated camera-to-camera transform is implied.</text>
</svg>
