<text x="897" y="117" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Analytic Values &amp; Joint Gaussian Chunk PPO</text>
<text x="655" y="152" font-size="14.5" font-weight="700" fill="#1e293b" text-anchor="start">Positive linear field: velocity = 8 * a + theta; batch=4, action dim=7</text>
<text x="665" y="186" font-size="15" fill="#334155" text-anchor="start">K= 2: full derivative norm = 31.749; last-step-only = 5.292</text>
<text x="665" y="218" font-size="15" fill="#334155" text-anchor="start">K= 5: full derivative norm = 155.853; last-step-only = 2.117</text>
