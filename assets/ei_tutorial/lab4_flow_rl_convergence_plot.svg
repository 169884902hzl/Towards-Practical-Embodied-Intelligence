<rect x="655" y="314" width="485" height="128" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="672" y="340" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">Key Implementation Checks in Lab 4:</text>
<text x="672" y="365" font-size="13.5" fill="#334155" text-anchor="start">1. Joint chunk density sums log_prob over (H, D): .sum(dim=(1, 2))</text>
<text x="672" y="390" font-size="13.5" fill="#334155" text-anchor="start">2. Forward trajectories are identical; truncation changes the gradient estimator.</text>
<text x="672" y="415" font-size="13.5" fill="#475569" text-anchor="start">3. Chosen unstable field only. Neither a variance theorem nor robot RL score.</text>
