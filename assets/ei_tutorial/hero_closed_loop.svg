  <text x="966" y="178" font-size="10" fill="#334155">• Cartesian Impedance (K_p, K_d)</text>
  <text x="966" y="194" font-size="10" fill="#334155">• Hybrid Force-Position Projection</text>
  <text x="966" y="210" font-size="10" fill="#334155">• Whole-Body QP / Torque Control</text>

