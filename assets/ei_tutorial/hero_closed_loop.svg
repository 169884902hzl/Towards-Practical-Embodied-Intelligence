  <rect x="968" y="276" width="184" height="44" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1060" y="293" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">A. Contact-Rich Assembly</text>
  <text x="1060" y="309" text-anchor="middle" font-size="9.5" fill="#334155">Sub-mm peg-in-hole, PCB, snap-fit</text>

  <rect x="968" y="328" width="184" height="44" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1060" y="345" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">B. Deformable &amp; Bimanual</text>
  <text x="1060" y="361" text-anchor="middle" font-size="9.5" fill="#334155">Cloth folding, DLO cable harnessing</text>

  <rect x="968" y="380" width="184" height="44" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1060" y="397" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">C. High-DoF Dexterous Hands</text>
  <text x="1060" y="413" text-anchor="middle" font-size="9.5" fill="#334155">20+ DoF in-hand tool manipulation</text>

  <rect x="968" y="432" width="184" height="44" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1060" y="449" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">D. Humanoid Loco-Manipulation</text>
  <text x="1060" y="465" text-anchor="middle" font-size="9.5" fill="#334155">Mobile bimanual &amp; whole-body agility</text>

