  <path d="M 1060,502 L 1060,555 L 157,555 L 157,508" fill="none" stroke="#0f172a" stroke-width="2.8"/>
  <polygon points="151,512 157,500 163,512" fill="#0f172a"/>
  <rect x="330" y="536" width="540" height="34" rx="17" fill="#0f172a"/>
