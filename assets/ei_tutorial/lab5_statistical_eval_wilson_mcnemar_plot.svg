<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" font-family="Arial, sans-serif">
<rect width="1200" height="100%" fill="#FFFFFF"/>
<text x="600" y="36" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">Lab 5: paired statistics from the script&#x27;s example data</text>
<text x="600" y="64" font-size="14.5" fill="#475569" text-anchor="middle">SYNTHETIC - NOT REAL RESULTS; Method A/B/C/D do not identify published methods</text>
<rect x="40" y="92" width="700" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="65" y="122" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Arbitrary paired outcomes, N=50; Wilson 95% intervals</text>
<line x1="340.0" y1="140" x2="340.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3,3"/>
<text x="340.0" y="398" font-size="12" fill="#64748b" text-anchor="middle">0%</text>
<line x1="430.0" y1="140" x2="430.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3,3"/>
<text x="430.0" y="398" font-size="12" fill="#64748b" text-anchor="middle">25%</text>
<line x1="520.0" y1="140" x2="520.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3,3"/>
<text x="520.0" y="398" font-size="12" fill="#64748b" text-anchor="middle">50%</text>
<line x1="610.0" y1="140" x2="610.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3,3"/>
<text x="610.0" y="398" font-size="12" fill="#64748b" text-anchor="middle">75%</text>
<line x1="700.0" y1="140" x2="700.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3,3"/>
<text x="700.0" y="398" font-size="12" fill="#64748b" text-anchor="middle">100%</text>
<text x="65" y="168" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Method A: 22/50 = 44.0%</text>
<line x1="452.2" y1="163" x2="547.7" y2="163" stroke="#2563eb" stroke-width="4"/>
<line x1="452.2" y1="156" x2="452.2" y2="170" stroke="#2563eb" stroke-width="2.5"/>
<line x1="547.7" y1="156" x2="547.7" y2="170" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="498.4" cy="163" r="6" fill="#1d4ed8"/>
<text x="65" y="188" font-size="13.5" fill="#475569" text-anchor="start">95% interval: [31.2%, 57.7%]</text>
<text x="65" y="222" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Method B: 29/50 = 58.0%</text>
<line x1="499.2" y1="217" x2="594.2" y2="217" stroke="#2563eb" stroke-width="4"/>
<line x1="499.2" y1="210" x2="499.2" y2="224" stroke="#2563eb" stroke-width="2.5"/>
<line x1="594.2" y1="210" x2="594.2" y2="224" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="548.8" cy="217" r="6" fill="#1d4ed8"/>
<text x="65" y="242" font-size="13.5" fill="#475569" text-anchor="start">95% interval: [44.2%, 70.6%]</text>
<text x="65" y="276" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Method C: 34/50 = 68.0%</text>
<line x1="535.1" y1="271" x2="625.3" y2="271" stroke="#2563eb" stroke-width="4"/>
<line x1="535.1" y1="264" x2="535.1" y2="278" stroke="#2563eb" stroke-width="2.5"/>
<line x1="625.3" y1="264" x2="625.3" y2="278" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="584.8" cy="271" r="6" fill="#1d4ed8"/>
<text x="65" y="296" font-size="13.5" fill="#475569" text-anchor="start">95% interval: [54.2%, 79.2%]</text>
<text x="65" y="330" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="start">Method D: 44/50 = 88.0%</text>
<line x1="614.3" y1="325" x2="679.8" y2="325" stroke="#2563eb" stroke-width="4"/>
<line x1="614.3" y1="318" x2="614.3" y2="332" stroke="#2563eb" stroke-width="2.5"/>
<line x1="679.8" y1="318" x2="679.8" y2="332" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="656.8" cy="325" r="6" fill="#1d4ed8"/>
<text x="65" y="350" font-size="13.5" fill="#475569" text-anchor="start">95% interval: [76.2%, 94.4%]</text>
<rect x="760" y="92" width="400" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="760" y="92" width="400" height="38" rx="10" fill="#0d9488"/>
<text x="960" y="117" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">Paired McNemar &amp; Small-N Check</text>
<text x="782" y="158" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Method D vs Method C (N=50 paired):</text>
<text x="782" y="186" font-size="14" fill="#334155" text-anchor="start">• Discordant pairs: b=12 (D only), c=2 (C only)</text>
<text x="782" y="212" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">• Exact two-sided McNemar p = 0.01293945</text>
<rect x="780" y="242" width="360" height="156" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
<text x="798" y="270" font-size="14.5" font-weight="700" fill="#9f1239" text-anchor="start">Small-Sample Trap (10/10 Successes):</text>
<text x="798" y="298" font-size="13.5" fill="#be123c" text-anchor="start">• Naive Wald CI: [100.0%, 100.0%] (overconfident)</text>
<text x="798" y="324" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="start">• Wilson 95% CI: [72.2%, 100.0%]</text>
<text x="798" y="354" font-size="13" fill="#334155" text-anchor="start">• Always report exact k/N alongside interval bounds.</text>
<text x="65" y="455" font-size="16.5" font-weight="700" fill="#1e293b" text-anchor="start">D vs C: discordant pairs 12/2; exact two-sided McNemar p = 0.01293945</text>
<text x="65" y="485" font-size="15.5" fill="#475569" text-anchor="start">10/10 example: Wald [100, 100]%; Wilson [72.2, 100.0]%. No MDE/power claim.</text>
</svg>
