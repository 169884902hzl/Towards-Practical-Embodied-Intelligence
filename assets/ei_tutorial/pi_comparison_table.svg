<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="540" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Architectural Parameter &amp; Training Matrix Across Six Generations of pi Models</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#475569">Verified Specifications from Official Technical Reports (arXiv:2410.24164, 2501.09747, 2504.16054, 2505.23705, 2511.14759, 2604.15483)</text>

  <!-- Table Container -->
  <rect x="30" y="78" width="1140" height="430" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Table Header -->
  <rect x="30" y="78" width="1140" height="42" rx="8" fill="#0f172a"/>
  <text x="115" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Model Generation</text>
  <text x="290" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">VLM Backbone</text>
  <text x="475" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Action Expert / Head</text>
  <text x="685" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Training Objective &amp; Gradient Flow</text>
  <text x="910" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Conditioning &amp; Post-Training</text>
  <text x="1095" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Open Weights</text>

  <!-- Row 1: pi_0 -->
  <rect x="31" y="120" width="1138" height="62" fill="#f8fafc"/>
  <text x="115" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">pi_0 (Oct 2024)</text>
  <text x="115" y="166" text-anchor="middle" font-size="10.5" fill="#64748b">arXiv:2410.24164</text>
  <text x="290" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">PaliGemma-3B</text>
  <text x="290" y="166" text-anchor="middle" font-size="10.5" fill="#64748b">(SigLIP-400M + Gemma-2B)</text>
  <text x="475" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">300M Flow Expert</text>
  <text x="475" y="166" text-anchor="middle" font-size="10.5" fill="#64748b">K=10 Euler ODE (50Hz, H=50)</text>
  <text x="685" y="148" text-anchor="middle" font-size="11" fill="#334155">Conditional OT Flow Matching L_CFM</text>
  <text x="685" y="166" text-anchor="middle" font-size="10.5" fill="#e11d48">End-to-end joint grad (VLM drift risk)</text>
  <text x="910" y="148" text-anchor="middle" font-size="11" fill="#334155">Task prompt l + Proprioception q_t</text>
  <text x="910" y="166" text-anchor="middle" font-size="10.5" fill="#64748b">Supervised SFT post-training</text>
  <rect x="1045" y="136" width="100" height="26" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1095" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Yes (openpi)</text>

  <!-- Row 2: pi_0-FAST -->
  <rect x="31" y="182" width="1138" height="62" fill="#ffffff"/>
  <text x="115" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0369a1">pi_0-FAST (Jan 25)</text>
  <text x="115" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">arXiv:2501.09747</text>
  <text x="290" y="210" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">PaliGemma-3B</text>
  <text x="290" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">Unified Autoregressive VLM</text>
  <text x="475" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0284c7">DCT + BPE Action Tokens</text>
  <text x="475" y="228" text-anchor="middle" font-size="10.5" fill="#64748b">30–60 discrete tokens / chunk</text>
  <text x="685" y="210" text-anchor="middle" font-size="11" fill="#334155">Next-Token Cross-Entropy Loss</text>
  <text x="685" y="228" text-anchor="middle" font-size="10.5" fill="#059669">5x faster pretraining convergence</text>
  <text x="910" y="210" text-anchor="middle" font-size="11" fill="#334155">Task prompt l + Discrete state</text>
  <text x="910" y="228" text-anchor="middle" font-size="10.5" fill="#d97706">Slow AR test inference (~200 ms)</text>
  <rect x="1045" y="198" width="100" height="26" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1095" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Yes (openpi)</text>

  <!-- Row 3: pi_0.5 + KI -->
  <rect x="31" y="244" width="1138" height="66" fill="#f8fafc"/>
  <text x="115" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">pi_0.5 + KI (Apr 25)</text>
  <text x="115" y="290" text-anchor="middle" font-size="10.5" fill="#64748b">arXiv:2504.16054</text>
  <text x="290" y="272" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">PaliGemma-3B</text>
  <text x="290" y="290" text-anchor="middle" font-size="10.5" fill="#0f766e">Semantic Subtask CoT + FAST</text>
  <text x="475" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d9488">300M Flow Expert + FAST</text>
  <text x="475" y="290" text-anchor="middle" font-size="10.5" fill="#64748b">Dual-head train, Flow-only test</text>
  <text x="685" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">L_CE(FAST/Web) + L_CFM(stop_grad(KV))</text>
  <text x="685" y="290" text-anchor="middle" font-size="10.5" fill="#059669">Knowledge Insulation prevents forgetting</text>
  <text x="910" y="272" text-anchor="middle" font-size="11" fill="#334155">Hierarchical Task -&gt; Text Subtask -&gt; Action</text>
  <text x="910" y="290" text-anchor="middle" font-size="10.5" fill="#64748b">Heterogeneous Web + Cross-Robot Data</text>
  <rect x="1045" y="262" width="100" height="26" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1095" y="279" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Yes (openpi)</text>

  <!-- Row 4: RTC -->
  <rect x="31" y="310" width="1138" height="62" fill="#ffffff"/>
  <text x="115" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">RTC (Jun/Dec 2025)</text>
  <text x="115" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">arXiv:2506.07339</text>
  <text x="290" y="338" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Any Flow VLA</text>
  <text x="290" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">(pi_0 / pi_0.5 / pi_0.6)</text>
  <text x="475" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">Soft-Masked Flow Inpainting</text>
  <text x="475" y="356" text-anchor="middle" font-size="10.5" fill="#64748b">Locks committed prefix a_{0:d}</text>
  <text x="685" y="338" text-anchor="middle" font-size="11" fill="#334155">Inference Guidance or Training-Time Prefix</text>
  <text x="685" y="356" text-anchor="middle" font-size="10.5" fill="#6d28d9">W_i = c_i(e^{c_i}-1)/(e-1) + clipped VJP</text>
  <text x="910" y="338" text-anchor="middle" font-size="11" fill="#334155">Conditioned on previously committed a_{0:d}</text>
  <text x="910" y="356" text-anchor="middle" font-size="10.5" fill="#059669">Zero inter-chunk pause under 200ms delay</text>
  <rect x="1045" y="326" width="100" height="26" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1095" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Algorithm Open</text>

  <!-- Row 5: pi*_{0.6} / RECAP (UPDATED TO 860M!) -->
  <rect x="31" y="372" width="1138" height="66" fill="#fffbeb"/>
  <text x="115" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">pi*_{0.6} / RECAP</text>
  <text x="115" y="418" text-anchor="middle" font-size="10.5" fill="#64748b">arXiv:2511.14759</text>
  <text x="290" y="400" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Gemma 3-4B VLM</text>
  <text x="290" y="418" text-anchor="middle" font-size="10.5" fill="#b45309">(Upgraded ~4B Backbone)</text>
  <text x="475" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">860M Flow Action Expert</text>
  <text x="475" y="418" text-anchor="middle" font-size="10.5" fill="#92400e">(Scaled 2.8x from 300M -&gt; 860M)</text>
  <text x="685" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Advantage-Conditioned Flow + CFG</text>
  <text x="685" y="418" text-anchor="middle" font-size="10.5" fill="#334155">v_CFG = v(null) + w*(v(I=1) - v(null))</text>
  <text x="910" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Optimality Indicator I_t = 1[A^pi &gt; eps]</text>
  <text x="910" y="418" text-anchor="middle" font-size="10.5" fill="#334155">Iterative Offline + Online + HIL Rollouts</text>
  <rect x="1045" y="390" width="100" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1095" y="407" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Closed (Repro)</text>

  <!-- Row 6: pi_{0.7} (UPDATED TO 14B Subgoal Generator!) -->
  <rect x="31" y="438" width="1138" height="68" fill="#ecfdf5"/>
  <text x="115" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">pi_{0.7} (Apr 2026)</text>
  <text x="115" y="484" text-anchor="middle" font-size="10.5" fill="#64748b">arXiv:2604.15483</text>
  <text x="290" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">Gemma 3-4B VLM +</text>
  <text x="290" y="484" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">14B Visual Subgoal Generator</text>
  <text x="475" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#059669">Flow Action Expert (pi_0.5 / pi*_{0.6} family)</text>
  <text x="475" y="484" text-anchor="middle" font-size="10.5" fill="#047857">Conditioned on 4-Channel Context</text>
  <text x="685" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Context-Disambiguated Flow Matching</text>
  <text x="685" y="484" text-anchor="middle" font-size="10.5" fill="#334155">Separates noise/suboptimal data via metadata</text>
  <text x="910" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">4-Channel: Task + 14B Image Subgoal +</text>
  <text x="910" y="484" text-anchor="middle" font-size="10.5" fill="#047857">Metadata (Speed/Quality/Source) + State</text>
  <rect x="1045" y="456" width="100" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1095" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Closed (Paper)</text>
</svg>
