<text x="340" y="254" font-size="12.5" fill="#334155" text-anchor="middle">Chunk index i (blue solid: paper W_i; amber dashed: exp(-0.25*(i-d)))</text>
<rect x="625" y="102" width="515" height="148" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="645" y="128" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">Exact RTC Equations (Black et al., arXiv:2506.07339, Eq. 2-5):</text>
<text x="645" y="156" font-size="13" fill="#334155" text-anchor="start">• Overlap decay:  c_i = (H - s - i) / (H - s - d + 1),  W_i = c_i*(exp(c_i)-1)/(e-1)</text>
<text x="645" y="182" font-size="13.5" fill="#334155" text-anchor="start">• Denoised endpoint:  a_hat_1 = a_tau + (1 - tau) * v_theta(a_tau, tau)</text>
<text x="645" y="208" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="start">• Clipped VJP weight:  coeff = min(beta, (1 - tau) / (tau * r_tau^2))</text>
<text x="645" y="234" font-size="13.5" fill="#334155" text-anchor="start">• Guided velocity:  v_rtc = v_theta + coeff * (d a_hat_1 / d a_tau)^T [W * (y - a_hat_1)]</text>
<rect x="40.0" y="282.0" width="357.3" height="191" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="40.0" y="282.0" width="357.3" height="36" rx="10" fill="#2563eb"/>
<text x="56.0" y="306" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">1. Build the soft mask</text>
<text x="56.0" y="342" font-size="15.5" fill="#1e293b" text-anchor="start">Committed prefix: weight 1;</text>
<text x="56.0" y="363" font-size="15.5" fill="#1e293b" text-anchor="start">distant suffix: weight 0.</text>
<text x="56.0" y="389" font-size="15.5" fill="#1e293b" text-anchor="start">Transition uses the paper mask;</text>
<text x="56.0" y="410" font-size="15.5" fill="#1e293b" text-anchor="start">optional variants are explicit.</text>
<line x1="399.3" y1="377.5" x2="411.3" y2="377.5" stroke="#64748b" stroke-width="2.5"/>
<polygon points="405.3,372.5 411.3,377.5 405.3,382.5" fill="#64748b"/>
<rect x="413.3" y="282.0" width="357.3" height="191" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<rect x="413.3" y="282.0" width="357.3" height="36" rx="10" fill="#0d9488"/>
<text x="429.3333333333333" y="306" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">2. Compute the endpoint VJP</text>
<text x="429.3333333333333" y="342" font-size="15.5" fill="#1e293b" text-anchor="start">Endpoint = a + (1 - time) *</text>
<text x="429.3333333333333" y="363" font-size="15.5" fill="#1e293b" text-anchor="start">velocity.</text>
<text x="429.3333333333333" y="389" font-size="15.5" fill="#1e293b" text-anchor="start">Use the endpoint Jacobian, not an</text>
<text x="429.3333333333333" y="410" font-size="15.5" fill="#1e293b" text-anchor="start">identity approximation.</text>
<line x1="772.7" y1="377.5" x2="784.7" y2="377.5" stroke="#64748b" stroke-width="2.5"/>
<polygon points="778.7,372.5 784.7,377.5 778.7,382.5" fill="#64748b"/>
<rect x="786.7" y="282.0" width="357.3" height="191" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<rect x="786.7" y="282.0" width="357.3" height="36" rx="10" fill="#7c3aed"/>
<text x="802.6666666666666" y="306" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">3. Integrate finite guidance</text>
<text x="802.6666666666666" y="342" font-size="15.5" fill="#1e293b" text-anchor="start">Clip the guidance coefficient at</text>
<text x="802.6666666666666" y="363" font-size="15.5" fill="#1e293b" text-anchor="start">beta, including time zero.</text>
<text x="802.6666666666666" y="389" font-size="15.5" fill="#1e293b" text-anchor="start">Report action differences, not a</text>
<text x="802.6666666666666" y="410" font-size="15.5" fill="#1e293b" text-anchor="start">velocity or acceleration</text>
<text x="802.6666666666666" y="431" font-size="15.5" fill="#1e293b" text-anchor="start">guarantee.</text>
<text x="600" y="517" font-size="14" fill="#475569" text-anchor="middle">Source: labs/lab2_rtc_soft_masked_inpainting.py; Black et al., arXiv:2506.07339, equations 2-5.</text>
</svg>
