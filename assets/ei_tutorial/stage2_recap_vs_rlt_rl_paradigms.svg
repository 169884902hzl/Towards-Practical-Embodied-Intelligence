<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="100%" height="100%" font-family="Arial, sans-serif">
<rect width="1200" height="100%" fill="#FFFFFF"/>
<text x="600" y="36" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">Post-training interfaces: distinguish the optimization target</text>
<text x="600" y="64" font-size="14.5" fill="#475569" text-anchor="middle">Conceptual comparison - no unconditional gradient-explosion theorem</text>
<rect x="40.0" y="90.0" width="357.3" height="212" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="40.0" y="90.0" width="357.3" height="36" rx="10" fill="#2563eb"/>
<text x="56.0" y="114" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">RECAP: condition generation</text>
<text x="56.0" y="150" font-size="15.5" fill="#1e293b" text-anchor="start">Use advantage information in a</text>
<text x="56.0" y="171" font-size="15.5" fill="#1e293b" text-anchor="start">supervised generative objective.</text>
<text x="56.0" y="197" font-size="15.5" fill="#1e293b" text-anchor="start">Read the paper&#x27;s data collection</text>
<text x="56.0" y="218" font-size="15.5" fill="#1e293b" text-anchor="start">and improvement loop separately.</text>
<rect x="413.3" y="90.0" width="357.3" height="212" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<rect x="413.3" y="90.0" width="357.3" height="36" rx="10" fill="#0d9488"/>
<text x="429.3333333333333" y="114" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">RL Token: compact RL interface</text>
<text x="429.3333333333333" y="150" font-size="15.5" fill="#1e293b" text-anchor="start">Expose a compact representation</text>
<text x="429.3333333333333" y="171" font-size="15.5" fill="#1e293b" text-anchor="start">and train a small actor-critic</text>
<text x="429.3333333333333" y="192" font-size="15.5" fill="#1e293b" text-anchor="start">interface.</text>
<text x="429.3333333333333" y="218" font-size="15.5" fill="#1e293b" text-anchor="start">Do not confuse an RL token with</text>
<text x="429.3333333333333" y="239" font-size="15.5" fill="#1e293b" text-anchor="start">output action tokenization.</text>
<rect x="786.7" y="90.0" width="357.3" height="212" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<rect x="786.7" y="90.0" width="357.3" height="36" rx="10" fill="#7c3aed"/>
<text x="802.6666666666666" y="114" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="start">Conditional Gaussian PPO</text>
<text x="802.6666666666666" y="150" font-size="15.5" fill="#1e293b" text-anchor="start">A joint chunk density sums log-</text>
<text x="802.6666666666666" y="171" font-size="15.5" fill="#1e293b" text-anchor="start">probability over all action</text>
<text x="802.6666666666666" y="192" font-size="15.5" fill="#1e293b" text-anchor="start">coordinates.</text>
<text x="802.6666666666666" y="218" font-size="15.5" fill="#1e293b" text-anchor="start">Stopping earlier gradients changes</text>
<text x="802.6666666666666" y="239" font-size="15.5" fill="#1e293b" text-anchor="start">the estimator, not the forward</text>
<text x="802.6666666666666" y="260" font-size="15.5" fill="#1e293b" text-anchor="start">trajectory.</text>
<text x="600" y="346" font-size="14" fill="#475569" text-anchor="middle">Sources: arXiv:2511.14759, 2604.23073; the conditional Gaussian example is in Lab 4, not a claimed reproduction.</text>
</svg>
