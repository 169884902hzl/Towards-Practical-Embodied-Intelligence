name: Labs & Docs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-labs-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU PyTorch
        run: python -m pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Verify public docs, references and generated teaching figures (offline)
        run: |
          python tools/check_public_release.py
          python tools/build_references.py --check
          python tools/build_lab_figures.py --check

      - name: Run All 5 Executable PyTorch Code Labs (with Assertions)
        run: |
          python labs/lab1_openpi_ki_and_latency_profiler.py
          python labs/lab2_rtc_soft_masked_inpainting.py
          python labs/lab3_cascade_tactile_flow.py
          python labs/lab4_final_step_gaussian_ppo_and_critic.py
          python labs/lab5_rigorous_robot_eval_statistics.py
